services:
  - type: web
    name: vctm-foundly
    env: python
    buildCommand: pip install -r requirements.txt || true
    startCommand: python3 server.py
    plan: free
    envVars:
      - key: SUPABASE_URL
        value: https://utwodwtccrmibmdwtpmc.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_DOMAINS
        value: vctm.in,vctm.edu
      - key: ADMIN_EMAIL
        value: admin@vctm.in
      - key: ADMIN_PASSWORD
        value: admin123
